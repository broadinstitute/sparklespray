# Datastore composite indexes for sparklespray
# Deploy with: gcloud datastore indexes create index.yaml --project=PROJECT_ID
#
# These indexes are required for queries that combine equality and inequality
# filters on different properties.

indexes:
  # Required for IncrementalTaskFetcher.get_tasks_updated_since()
  # Query: job_id = X AND last_updated > Y
  - kind: SparklesV6Task
    properties:
      - name: job_id
      - name: last_updated

  # Required for dashboard-backend event queries
  # Query: job_id = X ORDER BY timestamp
  - kind: SparklesV6Event
    properties:
      - name: job_id
      - name: timestamp

  # Required for dashboard-backend cluster event queries
  # Query: cluster_id = X AND type = Y ORDER BY timestamp
  - kind: SparklesV6Event
    properties:
      - name: cluster_id
      - name: type
      - name: timestamp
